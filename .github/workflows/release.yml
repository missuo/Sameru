name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Sameru $VERSION"

      # AppIcon.icon needs an actool from Xcode 26 or newer, so pick the newest
      # Xcode on the image rather than whatever is selected by default.
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          echo "SDK: $(xcrun --show-sdk-version --sdk macosx)"

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo -n "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$RUNNER_TEMP/certificate.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the keychain" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build
        run: |
          xcodebuild \
            -project Sameru.xcodeproj \
            -scheme Sameru \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Sign inside out: the embedded helper first, then the app that wraps it.
      # --deep is deprecated and would not apply the entitlements correctly here.
      #
      # Apple's timestamp service fails intermittently, and codesign leaves the
      # previous (ad-hoc) signature in place when it does. That is invisible until
      # notarization rejects the nested binary, so retry and then assert.
      - name: Sign
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Sameru.app"
          HELPER="$APP/Contents/Resources/SMCHelper/sameru-fan-helper"

          sign() {
            local target="$1"; shift
            for attempt in 1 2 3 4 5; do
              if codesign --force --timestamp --options runtime "$@" \
                   --sign "$SIGNING_IDENTITY" "$target" 2>&1 | tee /tmp/codesign.log; then
                if ! grep -q "timestamp service" /tmp/codesign.log; then
                  return 0
                fi
              fi
              echo "codesign attempt $attempt failed for $target, retrying in 10s"
              sleep 10
            done
            echo "could not sign $target" >&2
            return 1
          }

          assert_signed() {
            local target="$1"
            local info
            info=$(codesign --display --verbose=4 "$target" 2>&1)
            grep -q "flags=0x10000(runtime)" <<<"$info" \
              || { echo "$target is missing the hardened runtime flag" >&2; echo "$info" >&2; exit 1; }
            grep -q "Authority=Developer ID Application" <<<"$info" \
              || { echo "$target is not signed with Developer ID" >&2; echo "$info" >&2; exit 1; }
            echo "$target: hardened runtime + Developer ID confirmed"
          }

          # Sparkle ships its own nested bundles. Each must carry the hardened
          # runtime and a Developer ID signature, and they have to be signed
          # before the framework that contains them, which in turn precedes the
          # app. Deepest first.
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            for nested in \
              "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
              "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" \
              "$SPARKLE/Versions/B/Updater.app" \
              "$SPARKLE/Versions/B/Autoupdate"; do
              sign "$nested"
              assert_signed "$nested"
            done
            sign "$SPARKLE"
            assert_signed "$SPARKLE"
          fi

          sign "$HELPER"
          assert_signed "$HELPER"

          sign "$APP" --entitlements Sameru.entitlements
          assert_signed "$APP"

          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign --display --entitlements - "$APP"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/Build/Products/Release/Sameru.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Sameru-notarize.zip"

          notarize() {
            local archive="$1"
            set -o pipefail
            if xcrun notarytool submit "$archive" \
                 --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                 --password "$APPLE_APP_PASSWORD" --wait 2>&1 | tee "$RUNNER_TEMP/notary.log"; then
              return 0
            fi
            # "Invalid" says nothing on its own; the per-file reasons are in the log.
            local id
            id=$(grep -m1 -Eo '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' "$RUNNER_TEMP/notary.log" || true)
            if [ -n "$id" ]; then
              echo "===== notarization log for $id ====="
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" || true
            fi
            return 1
          }

          notarize "$RUNNER_TEMP/Sameru-notarize.zip"

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Build DMG
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="build/Build/Products/Release/Sameru.app"
          STAGE="$RUNNER_TEMP/dmg"
          DMG="Sameru-$VERSION.dmg"

          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create -volname "Sameru" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

          # A zip of the stapled app, for anyone who would rather not mount a disk image.
          ditto -c -k --keepParent "$APP" "Sameru-$VERSION.zip"
          echo "zip=Sameru-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          if ! xcrun notarytool submit "${{ steps.package.outputs.dmg }}" \
                 --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                 --password "$APPLE_APP_PASSWORD" --wait 2>&1 | tee "$RUNNER_TEMP/notary-dmg.log"; then
            id=$(grep -m1 -Eo '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' "$RUNNER_TEMP/notary-dmg.log" || true)
            if [ -n "$id" ]; then
              echo "===== notarization log for $id ====="
              xcrun notarytool log "$id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" || true
            fi
            exit 1
          fi

          xcrun stapler staple "${{ steps.package.outputs.dmg }}"
          xcrun stapler validate "${{ steps.package.outputs.dmg }}"

      - name: Verify Gatekeeper acceptance
        run: |
          hdiutil attach "${{ steps.package.outputs.dmg }}" -mountpoint "$RUNNER_TEMP/mnt" -nobrowse
          spctl --assess --type execute --verbose=4 "$RUNNER_TEMP/mnt/Sameru.app"
          hdiutil detach "$RUNNER_TEMP/mnt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            --title "Sameru $VERSION" \
            --generate-notes \
            "${{ steps.package.outputs.dmg }}" \
            "${{ steps.package.outputs.zip }}" \
            || gh release upload "v$VERSION" \
                 "${{ steps.package.outputs.dmg }}" \
                 "${{ steps.package.outputs.zip }}" --clobber

      # Sparkle's appcast lives on main and is what shipped copies poll. The zip is
      # the update payload, so its EdDSA signature has to match the asset the
      # release actually publishes.
      - name: Generate and publish appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SPARKLE_VERSION=2.9.4

          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          mkdir -p "$RUNNER_TEMP/updates"
          cp "${{ steps.package.outputs.zip }}" "$RUNNER_TEMP/updates/"

          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/missuo/Sameru/releases/download/v$VERSION/" \
            --link "https://github.com/missuo/Sameru" \
            "$RUNNER_TEMP/updates"

          # A tag build starts detached, so land the feed on main explicitly.
          git fetch --depth=1 origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/updates/appcast.xml" appcast.xml

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add appcast.xml
            git commit -m "chore: update appcast for $VERSION"
            git push origin main
          fi

          echo "--- appcast.xml ---"
          cat appcast.xml

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
